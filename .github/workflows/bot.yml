name: YouLikeHits Points Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante
  workflow_dispatch:

jobs:
  earn-points:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv
          playwright install chromium
          playwright install-deps chromium

      - name: Run bot session
        env:
          GOOGLE_COOKIES:   ${{ secrets.GOOGLE_COOKIES }}
          GOOGLE_COOKIES_2: ${{ secrets.GOOGLE_COOKIES_2 }}
          GOOGLE_COOKIES_3: ${{ secrets.GOOGLE_COOKIES_3 }}
          GOOGLE_COOKIES_4: ${{ secrets.GOOGLE_COOKIES_4 }}
          GOOGLE_COOKIES_5: ${{ secrets.GOOGLE_COOKIES_5 }}
        run: python bot_cloud.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
