name: YouLikeHits Points Bot

on:
  schedule:
    # Har 1 ghante mein run hoga (24/7, laptop band ho toh bhi)
    - cron: '0 * * * *'
  workflow_dispatch:  # Manual trigger bhi kar sakte ho

jobs:
  earn-points:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv
          playwright install chromium
          playwright install-deps chromium

      - name: Run bot session
        env:
          YLH_LOGIN_ID: ${{ secrets.YLH_LOGIN_ID }}
          YLH_PASSWORD: ${{ secrets.YLH_PASSWORD }}
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
          YLH_USERNAME: ${{ secrets.YLH_USERNAME }}
          MAX_LIKES: "15"
        run: python bot_cloud.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
